name: Sync My Topics (OpenAlex)

on:
  schedule:
    - cron: "23 6 * * *"      # daily 06:23 UTC (~15:23 KST)
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "_data/topics_config.yml"      # 토픽을 admin/직접 편집하면 즉시 재생성
      - "tools/gen_topics.py"
      - ".github/workflows/topics.yml"

permissions:
  contents: write

concurrency:
  group: sync-topics
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Generate My Topics feed (OpenAlex — keyless)
        run: python tools/gen_topics.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/topics.json _data/topics_new.json _data/scholars.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh My Topics feed + archive + scholars (OpenAlex) [skip ci]"
            git push
          fi
