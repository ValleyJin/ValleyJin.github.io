name: Sync comment counts (giscus/Discussions)

on:
  schedule:
    - cron: "17 */6 * * *"     # 6시간마다
  workflow_dispatch: {}

permissions:
  contents: write
  discussions: read

concurrency:
  group: sync-comments
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate comment counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/gen_comment_counts.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/comment_counts.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh comment counts (giscus) [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
