name: Sync GitHub activity

on:
  schedule:
    - cron: "40 20 * * *"      # daily 20:40 UTC = 05:40 KST
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ ".github/workflows/update-github.yml" ]

permissions:
  contents: write

concurrency:
  group: sync-github
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build _data/github.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = '${{ vars.GH_USER || github.repository_owner }}';

            // --- profile ---
            const { data: u } = await github.rest.users.getByUsername({ username: user });

            // --- repositories (owner, non-fork) ---
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: user, type: 'owner', per_page: 100, sort: 'pushed'
            });
            const own = repos.filter(r => !r.fork && !r.archived);

            const totalStars = own.reduce((s, r) => s + (r.stargazers_count || 0), 0);

            // --- language byte aggregation (cap to keep it fast) ---
            const bytes = {};
            for (const r of own.slice(0, 60)) {
              try {
                const { data: langs } = await github.rest.repos.listLanguages({ owner: user, repo: r.name });
                for (const [k, v] of Object.entries(langs)) bytes[k] = (bytes[k] || 0) + v;
              } catch (e) {}
            }
            const totalBytes = Object.values(bytes).reduce((a, b) => a + b, 0) || 1;
            const languages = Object.entries(bytes)
              .sort((a, b) => b[1] - a[1]).slice(0, 5)
              .map(([name, b]) => ({ name, pct: Math.round((b / totalBytes) * 100) }));

            // --- recent pushed repos ---
            const recent = own
              .filter(r => r.description || r.stargazers_count > 0)
              .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at))
              .slice(0, 6)
              .map(r => ({
                name: r.name, desc: r.description || '', lang: r.language || 'repo',
                stars: r.stargazers_count || 0, url: r.html_url,
                pushed: (r.pushed_at || '').slice(0, 10)
              }));

            // --- contributions (GraphQL calendar) ---
            let contributions = null;
            try {
              const q = `query($login:String!){ user(login:$login){ contributionsCollection{ contributionCalendar{ totalContributions } } } }`;
              const g = await github.graphql(q, { login: user });
              contributions = g.user.contributionsCollection.contributionCalendar.totalContributions;
            } catch (e) {}

            const out = {
              updated: new Date().toISOString().slice(0, 10),
              public_repos: u.public_repos,
              followers: u.followers,
              total_stars: totalStars,
              contributions,
              languages,
              recent
            };
            fs.mkdirSync('_data', { recursive: true });
            fs.writeFileSync('_data/github.json', JSON.stringify(out, null, 2) + '\n');
            core.info('Wrote _data/github.json');

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- _data/github.json; then
            git add _data/github.json
            git commit -m "chore: sync GitHub activity [skip ci]"
            git push
          else
            echo "No changes."
          fi
