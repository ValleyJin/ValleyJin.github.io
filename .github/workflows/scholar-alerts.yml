name: Sync Scholar alerts (email)

on:
  schedule:
    - cron: "20 21 * * *"      # daily 21:20 UTC = 06:20 KST (after topics)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scholar-alerts
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch Google Scholar alert emails (Gmail IMAP)
        env:
          GMAIL_USER: scholararticleforwarding@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python tools/gen_scholar_alerts.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_alerts.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh Scholar alerts [skip ci]"
            git push
          fi
