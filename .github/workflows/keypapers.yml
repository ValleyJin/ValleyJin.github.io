name: Key papers → related + citation alerts (Semantic Scholar)

on:
  schedule:
    - cron: "30 18 * * *"      # daily 18:30 UTC = 03:30 KST (topics 갱신 직후)
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "_data/pinned_papers.json"        # 키페이퍼 등록/수정 시 즉시 재크롤
      - "tools/gen_keypapers.py"
      - ".github/workflows/keypapers.yml"

permissions:
  contents: write

concurrency:
  group: sync-keypapers
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl related papers + cited-by (Semantic Scholar)
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}   # 있으면 429 회피(없어도 동작, 백오프)
        run: python tools/gen_keypapers.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/keypapers.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh key papers (related + citation alerts) [skip ci]"
            git pull --rebase origin main || true   # 동시 푸시와의 경합 방지
            git push
          fi
