# Decap CMS configuration
# Auth uses the GitHub backend via a lightweight OAuth proxy (Cloudflare Worker).
# See SETUP-CMS.md for the two one-time steps to make login work.

backend:
  name: github
  repo: ValleyJin/ValleyJin.github.io
  branch: main
  # base_url = deployed OAuth proxy (Cloudflare Worker)
  base_url: https://valleyjin-cms-auth.jscho71.workers.dev
  auth_endpoint: /auth

publish_mode: simple
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"
site_url: https://valleyjin.github.io
display_url: https://valleyjin.github.io
locale: en

collections:
  - name: posts
    label: "Post"
    label_singular: "Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "writing/{{slug}}/"
    summary: "{{title}}  ·  {{category}}  ·  {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm", format: "YYYY-MM-DD HH:mm:ss +0900" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["AI", "Blockchain", "Physical AI", "Dev", "Meta"]
        default: "AI"
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false }
      - { label: "Cover image", name: "cover", widget: "image", required: false, choose_url: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false, hint: "One or two sentences shown in listings." }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: settings
    label: "Settings"
    files:
      - name: topics
        label: "My Topics (research feed)"
        file: "_data/topics_config.yml"
        description: "Articles 페이지 'My Topics' 피드에 쓰는 팔로우 토픽. 저장하면 매일 도는 OpenAlex 자동갱신이 반영한다."
        fields:
          - label: "Topics"
            name: "topics"
            widget: "text"
            hint: "한 줄에 토픽 하나. '표시명 | 검색어' 형식이면 | 뒤가 실제 OpenAlex 검색어(선택). AI·DB 분야로 자동 제약."
          - { label: "Papers per topic", name: "per_topic", widget: "number", value_type: "int", default: 4, min: 1, max: 10 }
          - label: "Following scholars"
            name: "scholars"
            widget: "text"
            required: false
            hint: "한 줄에 학자 한 명. '표시명 | Google Scholar user id'. id는 프로필 URL scholar.google.com/citations?user=XXXX 의 user 값. 이름만 알면 관리자에게 요청."
          - { label: "Papers per scholar", name: "per_scholar", widget: "number", value_type: "int", default: 5, min: 1, max: 12 }
          - { label: "Only last N years", name: "years", widget: "number", value_type: "int", default: 3, min: 1, max: 10 }
          - { label: "Field concept (OpenAlex)", name: "field_concept", widget: "hidden", default: "C41008148" }
