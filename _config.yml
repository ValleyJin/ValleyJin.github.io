title: Jin Sam Cho
tagline: Coding + Business
description: >-
  Building at the intersection of AI systems, blockchain infrastructure,
  and physical AI. Engineer & builder from Korea.
author:
  name: Jin Sam Cho
  twitter: ValleyJin
url: "https://valleyjin.github.io"
lang: en
timezone: Asia/Seoul

github_user: ValleyJin
social:
  x: ValleyJin
  github: ValleyJin
  email: ""      # optional: fill to show a mailto link

# 링크 공유 시 뜨는 소셜 카드(Open Graph / Twitter Card)
twitter:
  username: ValleyJin
  card: summary_large_image

permalink: /writing/:title/
paginate: 8
paginate_path: "/writing/page:num/"

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "" }        # 모든 페이지 기본 og:image (개별 페이지 front matter의 image로 덮어쓰기 가능)
    values:
      image:
        path: /assets/images/og.png
        width: 1200
        height: 630

exclude:
  - README.md
  - SETUP-CMS.md
  - Gemfile
  - Gemfile.lock
  - script.py
  - tools
  - study
  - vendor
  - .github
  - node_modules

# Contact
kakao_openchat: "https://invite.kakao.com/tc/tD3bFvM0CC"   # KakaoTalk 오픈채팅
